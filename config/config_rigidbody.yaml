dataset:
  name: rigidbody
  integration_method: RK4
  duration: 0.5
  dt_num: 0.01
  dt_factor: 10

model:
  phy_option: none_FD_unsup
  aug_option: true
  hidden: 200
  init_gain: 1.0
  integration_method: RK4

train:
  lr: 1e-3
  niter: 5
  min_op: l2
  reg_loss_name: loss_FD_unsup
  lambda0: 5e-4
  tau2: 0.0
  aux_loss_names: ["loss_AD_sup", "loss_FD_unsup"]
  log_param_error: false # when hybrid
  nlog: 5
  nval: 5 
  curriculum: no_curr
  opt_mode: traj
  finite_diff: forward
  nepoch: 900

experiment:
  path: data_exp/rigidbody

logging:
  use_wandb: true
  project: RigidBodyICML
