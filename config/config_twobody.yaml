dataset:
  name: twobody
  integration_method: RK4
  duration: 5.0
  dt_num: 0.01
  dt_factor: 10

model:
  phy_option: none
  aug_option: true
  hidden: 200
  init_gain: 1.0
  integration_method: RK4

train:
  lr: 1e-3
  niter: 5
  min_op: l2
  reg_loss_name: none
  lambda0: 1.0
  tau2: 0.0
  aux_loss_names: ["loss_Fa", "loss_Fa_primeX", "loss_Fa_prime_supervisedX_norm"]
  log_param_error: false # when hybrid
  nlog: 5
  nval: 5 
  curriculum: no_curr
  opt_mode: constraint

experiment:
  path: data/twobody_gridsearch

logging:
  use_wandb: true
  project: TwoBodyProblem
