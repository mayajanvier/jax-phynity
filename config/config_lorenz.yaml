dataset:
  name: lorenz
  integration_method: RK4
  duration: 0.5
  dt_num: 0.01
  dt_factor: 1

model:
  phy_option: none
  aug_option: true
  hidden: 200
  init_gain: 1.0
  integration_method: RK4

train:
  lr: 1e-3
  niter: 1
  min_op: l2
  reg_loss_name: none
  lambda0: 1.0
  tau2: 0.0
  aux_loss_names: ["loss_AD_sup", "loss_FD_unsup"]
  log_param_error: false # true when hybrid
  nlog: 5
  nval: 5 
  curriculum: curr
  opt_mode: traj 
  finite_diff: forward
  
experiment:
  path: data_test/lorenz_gridsearch

logging:
  use_wandb: true
  project: Lorenz
